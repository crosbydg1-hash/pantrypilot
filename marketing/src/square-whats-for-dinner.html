<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@500;600;700&display=block">
<style>
h1,p{text-wrap:balance}:root{--paper:#F1F4F1;--ink:#16221F;--muted:#55635E;--teal:#2B656B;--teal-d:#1F4D52;--soft:#DAEAE8;--pap:#C2552A;--pap-soft:#F6E1D6;--white:#fff}
*{box-sizing:border-box;margin:0}html,body{width:var(--w);height:var(--h);overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;position:relative}
.serif{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.02em;line-height:1.02}
.brand{display:flex;align-items:center;gap:.4em;font-weight:700}
.badge{display:inline-flex;align-items:center;justify-content:center;background:var(--teal);border-radius:24%}
.pill{display:inline-flex;align-items:center;gap:.35em;border-radius:999px;font-weight:600;white-space:nowrap}
.cta{display:inline-flex;align-items:center;border-radius:999px;background:var(--pap);color:#fff;font-weight:700}
.photo{object-fit:cover;display:block}
.card{background:#fff;box-shadow:0 30px 60px -20px rgba(22,34,31,.35),0 2px 6px rgba(22,34,31,.08)}
.check{color:var(--teal);font-weight:800}
</style><style>:root{--w:1080px;--h:1080px}</style></head><body>
<div style="position:absolute;inset:0;padding:72px 76px;display:flex;flex-direction:column">
  <div class="brand" style="font-size:34px;color:var(--ink)"><span class="badge" style="width:54.400000000000006px;height:54.400000000000006px"><svg width="39.099999999999994" height="39.099999999999994" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13.4a2.8 2.8 0 0 1 1-5.4 3.2 3.2 0 0 1 6 0 2.8 2.8 0 0 1 1 5.4z"/><path d="M8 13.4h8v3H8z"/><path d="M2.8 3.5v3.4a1.7 1.7 0 0 0 3.4 0V3.5M4.5 3.5v4.2M4.5 8.6v11.9"/><rect x="17.6" y="3.3" width="3.8" height="5.4" rx=".7"/><path d="M19.5 5v2M19.5 8.7v11.8"/></svg></span>PantryPilot</div>
  <h1 class="serif" style="font-size:132px;margin-top:40px">What's for<br>dinner?</h1>
  <p style="font-size:36px;line-height:1.35;color:var(--muted);margin-top:22px;max-width:820px">Tell PantryPilot what's in your kitchen. It shows every recipe you can make right now.</p>
  <div class="card" style="margin-top:auto;border-radius:40px;padding:38px 40px;display:grid;gap:30px">
    <div style="display:flex;flex-wrap:wrap;gap:12px"><span class="pill" style="font-size:30px;padding:13.5px 24.0px;background:#fff;border:2px solid var(--soft)"><span class="check">✓</span>chicken</span><span class="pill" style="font-size:30px;padding:13.5px 24.0px;background:#fff;border:2px solid var(--soft)"><span class="check">✓</span>rice</span><span class="pill" style="font-size:30px;padding:13.5px 24.0px;background:#fff;border:2px solid var(--soft)"><span class="check">✓</span>garlic</span><span class="pill" style="font-size:30px;padding:13.5px 24.0px;background:#fff;border:2px solid var(--soft)"><span class="check">✓</span>lime</span></div>
    <div style="display:flex;align-items:center;gap:22px">
      <div style="display:flex"><img class="photo" src="../../img/r-green-curry.jpg" style="width:170px;height:170px;border-radius:30px;border:6px solid #fff;margin-left:0px"><img class="photo" src="../../img/r-beef-tacos.jpg" style="width:170px;height:170px;border-radius:30px;border:6px solid #fff;margin-left:-34px"><img class="photo" src="../../img/r-pad-thai.jpg" style="width:170px;height:170px;border-radius:30px;border:6px solid #fff;margin-left:-34px"></div>
      <div><div class="serif" style="font-size:64px;color:var(--teal)">14 recipes</div><div style="font-size:30px;color:var(--muted);font-weight:600">you can cook tonight</div></div>
    </div>
  </div>
</div></body></html>
