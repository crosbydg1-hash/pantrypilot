<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@500;600;700&display=block">
<style>
h1,p{text-wrap:balance}:root{--paper:#F1F4F1;--ink:#16221F;--muted:#55635E;--teal:#2B656B;--teal-d:#1F4D52;--soft:#DAEAE8;--pap:#C2552A;--pap-soft:#F6E1D6;--white:#fff}
*{box-sizing:border-box;margin:0}html,body{width:var(--w);height:var(--h);overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;position:relative}
.serif{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.02em;line-height:1.02}
.brand{display:flex;align-items:center;gap:.4em;font-weight:700}
.badge{display:inline-flex;align-items:center;justify-content:center;background:var(--teal);border-radius:24%}
.pill{display:inline-flex;align-items:center;gap:.35em;border-radius:999px;font-weight:600;white-space:nowrap}
.cta{display:inline-flex;align-items:center;border-radius:999px;background:var(--pap);color:#fff;font-weight:700}
.photo{object-fit:cover;display:block}
.card{background:#fff;box-shadow:0 30px 60px -20px rgba(22,34,31,.35),0 2px 6px rgba(22,34,31,.08)}
.check{color:var(--teal);font-weight:800}
</style><style>:root{--w:1080px;--h:1080px}</style></head><body>
<div style="position:absolute;inset:0;background:var(--teal);color:#fff;padding:72px 76px;display:flex;flex-direction:column">
  <div class="brand" style="font-size:34px;color:#fff"><svg width="44.2" height="44.2" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13.4a2.8 2.8 0 0 1 1-5.4 3.2 3.2 0 0 1 6 0 2.8 2.8 0 0 1 1 5.4z"/><path d="M8 13.4h8v3H8z"/><path d="M2.8 3.5v3.4a1.7 1.7 0 0 0 3.4 0V3.5M4.5 3.5v4.2M4.5 8.6v11.9"/><rect x="17.6" y="3.3" width="3.8" height="5.4" rx=".7"/><path d="M19.5 5v2M19.5 8.7v11.8"/></svg>PantryPilot</div>
  <h1 class="serif" style="font-size:112px;margin-top:40px">Plan the week.<br><span style="color:#F6C9B2">Shop once.</span></h1>
  <div style="margin-top:auto;display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:end">
    <div class="card" style="border-radius:36px;padding:30px;color:var(--ink);display:grid;gap:18px">
      <div style="display:flex;align-items:center;gap:16px"><b style="width:66px;font-size:28px;color:var(--muted)">Mon</b><img class="photo" src="../../img/r-baked-ziti.jpg" style="width:104px;height:104px;border-radius:20px"><span style="font-size:32px;font-weight:700;line-height:1.1">Baked Ziti</span></div><div style="display:flex;align-items:center;gap:16px"><b style="width:66px;font-size:28px;color:var(--muted)">Tue</b><img class="photo" src="../../img/r-beef-tacos.jpg" style="width:104px;height:104px;border-radius:20px"><span style="font-size:32px;font-weight:700;line-height:1.1">Beef Tacos</span></div><div style="display:flex;align-items:center;gap:16px"><b style="width:66px;font-size:28px;color:var(--muted)">Wed</b><img class="photo" src="../../img/r-green-curry.jpg" style="width:104px;height:104px;border-radius:20px"><span style="font-size:32px;font-weight:700;line-height:1.1">Green Curry</span></div><div style="display:flex;align-items:center;gap:16px"><b style="width:66px;font-size:28px;color:var(--muted)">Thu</b><img class="photo" src="../../img/r-pad-thai.jpg" style="width:104px;height:104px;border-radius:20px"><span style="font-size:32px;font-weight:700;line-height:1.1">Pad Thai</span></div>
    </div>
    <div class="card" style="border-radius:32px;padding:28px;color:var(--ink)">
      <div style="font-size:28px;font-weight:700;color:var(--muted);margin-bottom:14px">Shopping list</div>
      <div style="font-size:30px;padding:16px 0;border-top:2px solid #EEF2EF;display:flex;gap:12px"><span style="color:var(--teal)">☐</span>ziti</div><div style="font-size:30px;padding:16px 0;border-top:2px solid #EEF2EF;display:flex;gap:12px"><span style="color:var(--teal)">☐</span>ground beef</div><div style="font-size:30px;padding:16px 0;border-top:2px solid #EEF2EF;display:flex;gap:12px"><span style="color:var(--teal)">☐</span>coconut milk</div><div style="font-size:30px;padding:16px 0;border-top:2px solid #EEF2EF;display:flex;gap:12px"><span style="color:var(--teal)">☐</span>shrimp</div><div style="font-size:30px;padding:16px 0;border-top:2px solid #EEF2EF;display:flex;gap:12px"><span style="color:var(--teal)">☐</span>limes</div>
    </div>
  </div>
</div></body></html>
