<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@500;600;700&display=block">
<style>
h1,p{text-wrap:balance}:root{--paper:#F1F4F1;--ink:#16221F;--muted:#55635E;--teal:#2B656B;--teal-d:#1F4D52;--soft:#DAEAE8;--pap:#C2552A;--pap-soft:#F6E1D6;--white:#fff}
*{box-sizing:border-box;margin:0}html,body{width:var(--w);height:var(--h);overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;position:relative}
.serif{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.02em;line-height:1.02}
.brand{display:flex;align-items:center;gap:.4em;font-weight:700}
.badge{display:inline-flex;align-items:center;justify-content:center;background:var(--teal);border-radius:24%}
.pill{display:inline-flex;align-items:center;gap:.35em;border-radius:999px;font-weight:600;white-space:nowrap}
.cta{display:inline-flex;align-items:center;border-radius:999px;background:var(--pap);color:#fff;font-weight:700}
.photo{object-fit:cover;display:block}
.card{background:#fff;box-shadow:0 30px 60px -20px rgba(22,34,31,.35),0 2px 6px rgba(22,34,31,.08)}
.check{color:var(--teal);font-weight:800}
</style><style>:root{--w:1080px;--h:1920px}</style></head><body>
<img class="photo" src="../../img/r-green-curry.jpg" style="position:absolute;inset:0;width:100%;height:46%">
<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,34,31,.15) 0%,rgba(22,34,31,0) 22%,rgba(241,244,241,0) 36%,var(--paper) 46%)"></div>
<div style="position:absolute;top:120px;left:76px"><div class="brand" style="font-size:38px;color:#fff"><span class="badge" style="width:60.800000000000004px;height:60.800000000000004px"><svg width="43.699999999999996" height="43.699999999999996" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13.4a2.8 2.8 0 0 1 1-5.4 3.2 3.2 0 0 1 6 0 2.8 2.8 0 0 1 1 5.4z"/><path d="M8 13.4h8v3H8z"/><path d="M2.8 3.5v3.4a1.7 1.7 0 0 0 3.4 0V3.5M4.5 3.5v4.2M4.5 8.6v11.9"/><rect x="17.6" y="3.3" width="3.8" height="5.4" rx=".7"/><path d="M19.5 5v2M19.5 8.7v11.8"/></svg></span>PantryPilot</div></div>
<div style="position:absolute;left:76px;right:76px;top:820px;display:flex;flex-direction:column">
  <h1 class="serif" style="font-size:130px">Stop staring<br>into the fridge.</h1>
  <div style="display:grid;gap:34px;margin-top:60px">
    <div style="display:flex;gap:22px;align-items:center;font-size:44px;font-weight:600"><span class="pill" style="width:74px;height:74px;justify-content:center;background:var(--soft);color:var(--teal);font-size:34px">1</span>Add what you have</div><div style="display:flex;gap:22px;align-items:center;font-size:44px;font-weight:600"><span class="pill" style="width:74px;height:74px;justify-content:center;background:var(--soft);color:var(--teal);font-size:34px">2</span>See what you can cook</div><div style="display:flex;gap:22px;align-items:center;font-size:44px;font-weight:600"><span class="pill" style="width:74px;height:74px;justify-content:center;background:var(--soft);color:var(--teal);font-size:34px">3</span>Plan it and get the list</div>
  </div>
  <div style="margin-top:96px;display:flex;align-items:center;gap:36px">
    <span class="cta" style="font-size:44px;padding:32px 60px">Try it free</span>
    <span style="font-size:32px;color:var(--muted);font-weight:600">100+ recipes inside</span>
  </div>
</div></body></html>
